<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Content - Music Mates UK</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .upload-section {
            background-color: #333;
            border: 2px solid yellow;
            border-radius: 10px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .upload-section h2 {
            color: yellow;
            margin-bottom: 1rem;
            text-align: center;
        }
        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 10px;
            border: 2px solid yellow;
            background-color: #222;
            color: #FFD700;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #FFD700;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .upload-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .upload-type-card {
            background-color: #333;
            border: 2px solid yellow;
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .upload-type-card:hover {
            transform: scale(1.05);
            background-color: #444;
        }
        .upload-type-card.selected {
            background-color: yellow;
            color: black;
        }
        .upload-type-card h3 {
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .upload-type-card p {
            margin: 0;
            font-size: 0.9rem;
        }
        .uploaded-items {
            margin-top: 2rem;
        }
        .uploaded-item {
            background-color: #222;
            border: 1px solid yellow;
            border-radius: 5px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .uploaded-item h4 {
            color: yellow;
            margin: 0 0 0.5rem 0;
        }
        .uploaded-item p {
            margin: 0.25rem 0;
            color: #FFD700;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <h1>Upload Content - Music Mates UK</h1>
        <button class="nav-toggle" aria-controls="nav-panel" aria-expanded="false" aria-label="Toggle navigation menu">
            <span class="hamburger"></span>
        </button>
        <nav id="nav-panel" class="nav-panel">
            <ul class="nav-links">
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="interests.html">Interests</a></li>
                <li><a href="app.html">App</a></li>
                <li><a href="gigs.html">Gigs</a></li>
                <li><a href="where.html">Where</a></li>
            </ul>
            <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="upload-section">
                <h2>📤 What would you like to upload?</h2>
                <div class="upload-types">
                    <div class="upload-type-card" data-type="photo">
                        <h3>📷</h3>
                        <p>Photo</p>
                    </div>
                    <div class="upload-type-card" data-type="video">
                        <h3>🎥</h3>
                        <p>Video</p>
                    </div>
                    <div class="upload-type-card" data-type="gig">
                        <h3>🎸</h3>
                        <p>Gig Experience</p>
                    </div>
                    <div class="upload-type-card" data-type="playlist">
                        <h3>🎵</h3>
                        <p>Playlist</p>
                    </div>
                </div>
            </div>

            <div class="upload-section">
                <h2 id="form-title">Upload Details</h2>
                <form class="upload-form" id="uploadForm">
                    <input type="hidden" id="uploadType" value="">
                    
                    <div class="form-group">
                        <label for="title">Title *</label>
                        <input type="text" id="title" name="title" required minlength="1">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description"></textarea>
                    </div>

                    <div class="form-group" id="fileGroup">
                        <label for="file">Choose File *</label>
                        <input type="file" id="file" name="file" accept="image/*,video/*" required>
                    </div>

                    <div class="form-group" id="gigDateGroup" style="display: none;">
                        <label for="gigDate">Date</label>
                        <input type="date" id="gigDate" name="gigDate">
                    </div>

                    <div class="form-group" id="venueGroup" style="display: none;">
                        <label for="venue">Venue</label>
                        <input type="text" id="venue" name="venue">
                    </div>

                    <div class="form-group" id="bandGroup" style="display: none;">
                        <label for="band">Band/Artist</label>
                        <input type="text" id="band" name="band">
                    </div>

                    <div class="form-group" id="ratingGroup" style="display: none;">
                        <label for="rating">Rating (1-5)</label>
                        <select id="rating" name="rating">
                            <option value="">Select rating</option>
                            <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                            <option value="4">⭐⭐⭐⭐ (4)</option>
                            <option value="3">⭐⭐⭐ (3)</option>
                            <option value="2">⭐⭐ (2)</option>
                            <option value="1">⭐ (1)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
            </div>

            <div class="uploaded-items" id="uploadedItems" style="display: none;">
                <div class="upload-section">
                    <h2>📋 Your Uploads</h2>
                    <div id="itemsList"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="current-year">2025</span> Music Mates UK. All rights reserved.</p>
    </footer>

    <script>
        // Mobile navigation toggle
        const navToggle = document.querySelector('.nav-toggle');
        const navPanel = document.getElementById('nav-panel');
        const body = document.body;
        let lastFocusedElement = null;

        function openNav() {
            lastFocusedElement = document.activeElement;
            body.classList.add('nav-open');
            navToggle.setAttribute('aria-expanded', 'true');
            const firstLink = navPanel.querySelector('a');
            if (firstLink) firstLink.focus();
        }

        function closeNav() {
            body.classList.remove('nav-open');
            navToggle.setAttribute('aria-expanded', 'false');
            if (lastFocusedElement) lastFocusedElement.focus();
        }

        navToggle.addEventListener('click', () => {
            const isOpen = body.classList.contains('nav-open');
            if (isOpen) {
                closeNav();
            } else {
                openNav();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && body.classList.contains('nav-open')) {
                closeNav();
            }
        });

        navPanel.addEventListener('keydown', (e) => {
            if (e.key === 'Tab' && body.classList.contains('nav-open')) {
                const focusableElements = navPanel.querySelectorAll('a, button');
                const firstElement = focusableElements[0];
                const lastElement = focusableElements[focusableElements.length - 1];

                if (e.shiftKey && document.activeElement === firstElement) {
                    e.preventDefault();
                    lastElement.focus();
                } else if (!e.shiftKey && document.activeElement === lastElement) {
                    e.preventDefault();
                    firstElement.focus();
                }
            }
        });

        document.getElementById('current-year').textContent = new Date().getFullYear();

        let selectedType = '';

        // Handle upload type selection
        document.querySelectorAll('.upload-type-card').forEach(card => {
            card.addEventListener('click', function() {
                // Remove selected class from all cards
                document.querySelectorAll('.upload-type-card').forEach(c => c.classList.remove('selected'));
                
                // Add selected class to clicked card
                this.classList.add('selected');
                
                // Store selected type
                selectedType = this.dataset.type;
                document.getElementById('uploadType').value = selectedType;
                
                // Update form title
                const titles = {
                    photo: '📷 Upload Photo',
                    video: '🎥 Upload Video',
                    gig: '🎸 Share Gig Experience',
                    playlist: '🎵 Share Playlist'
                };
                document.getElementById('form-title').textContent = titles[selectedType];
                
                // Show/hide form fields based on type
                const fileGroup = document.getElementById('fileGroup');
                const gigDateGroup = document.getElementById('gigDateGroup');
                const venueGroup = document.getElementById('venueGroup');
                const bandGroup = document.getElementById('bandGroup');
                const ratingGroup = document.getElementById('ratingGroup');
                
                // Reset visibility
                fileGroup.style.display = 'flex';
                gigDateGroup.style.display = 'none';
                venueGroup.style.display = 'none';
                bandGroup.style.display = 'none';
                ratingGroup.style.display = 'none';
                
                // Show specific fields for gig type
                if (selectedType === 'gig') {
                    gigDateGroup.style.display = 'flex';
                    venueGroup.style.display = 'flex';
                    bandGroup.style.display = 'flex';
                    ratingGroup.style.display = 'flex';
                }
                
                // Update file input accept attribute
                const fileInput = document.getElementById('file');
                if (selectedType === 'photo') {
                    fileInput.accept = 'image/*';
                } else if (selectedType === 'video') {
                    fileInput.accept = 'video/*';
                } else if (selectedType === 'playlist') {
                    fileGroup.style.display = 'none';
                }
            });
        });

        // Handle form submission
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!selectedType) {
                alert('Please select an upload type first!');
                return;
            }
            
            // Get form data
            const formData = {
                type: selectedType,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                timestamp: new Date().toISOString()
            };
            
            // Add type-specific data
            if (selectedType === 'gig') {
                formData.date = document.getElementById('gigDate').value;
                formData.venue = document.getElementById('venue').value;
                formData.band = document.getElementById('band').value;
                formData.rating = document.getElementById('rating').value;
            }
            
            if (document.getElementById('file').files.length > 0) {
                formData.fileName = document.getElementById('file').files[0].name;
            }
            
            // Store in localStorage
            let uploads = JSON.parse(localStorage.getItem('uploads') || '[]');
            uploads.push(formData);
            localStorage.setItem('uploads', JSON.stringify(uploads));
            
            // Show success message
            alert(`${selectedType.charAt(0).toUpperCase() + selectedType.slice(1)} uploaded successfully!`);
            
            // Reset form
            this.reset();
            document.getElementById('uploadType').value = '';
            selectedType = '';
            document.querySelectorAll('.upload-type-card').forEach(c => c.classList.remove('selected'));
            document.getElementById('form-title').textContent = 'Upload Details';
            
            // Refresh uploaded items display
            displayUploadedItems();
        });

        // Display uploaded items
        function displayUploadedItems() {
            const uploads = JSON.parse(localStorage.getItem('uploads') || '[]');
            const itemsList = document.getElementById('itemsList');
            const uploadedItemsSection = document.getElementById('uploadedItems');
            
            if (uploads.length === 0) {
                uploadedItemsSection.style.display = 'none';
                return;
            }
            
            uploadedItemsSection.style.display = 'block';
            
            itemsList.innerHTML = uploads.map(upload => {
                const date = new Date(upload.timestamp).toLocaleDateString();
                const typeIcon = {
                    photo: '📷',
                    video: '🎥',
                    gig: '🎸',
                    playlist: '🎵'
                }[upload.type] || '📄';
                
                let details = `<p>Uploaded on: ${date}</p>`;
                if (upload.description) {
                    details += `<p>${upload.description}</p>`;
                }
                if (upload.type === 'gig') {
                    if (upload.band) details += `<p>Band: ${upload.band}</p>`;
                    if (upload.venue) details += `<p>Venue: ${upload.venue}</p>`;
                    if (upload.date) details += `<p>Date: ${upload.date}</p>`;
                    if (upload.rating) details += `<p>Rating: ${'⭐'.repeat(parseInt(upload.rating))}</p>`;
                }
                
                return `
                    <div class="uploaded-item">
                        <h4>${typeIcon} ${upload.title}</h4>
                        ${details}
                    </div>
                `;
            }).reverse().join('');
        }

        // Load uploaded items on page load
        displayUploadedItems();
    </script>
</body>
</html>
