<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Mates - Dating App</title>
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="nav-bar">
            <a href="index.html" class="brand">🎵 Music Mates UK</a>
            <ul class="nav-links">
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="interests.html">Interests</a></li>
                <li><a href="app.html">App</a></li>
                <li><a href="gigs.html">Gigs</a></li>
                <li><a href="where.html">Where</a></li>
                <li><button id="themeToggle">Light</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <h1 class="text-center mb-2">Find Your Music Match</h1>
            <div id="profile-container">
                <div class="profile-card">
                    <img src="profile-photo-url" alt="Profile Photo">
                    <h2 id="name">Name</h2>
                    <p id="age-city">Age, City</p>
                    <p id="distance">Distance: X miles</p>
                    <p id="bands">Shared Bands: <span class="text-muted">Band1, Band2</span></p>
                    <p id="genre-badge">Genres: Rock, Pop</p>
                    <p id="last-gig">Last Gig: Gig Name</p>
                    <div class="buttons">
                        <button class="button" onclick="likeProfile()">Like</button>
                        <button class="button" onclick="passProfile()">Pass</button>
                    </div>
                </div>
            </div>
            <div id="matches-section">
                <h2>Who's Struck a Chord With You</h2>
                <div id="matches-list"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Music Mates UK. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Dynamic year in footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('theme-light');
            if (document.body.classList.contains('theme-light')) {
                themeToggle.textContent = 'Dark';
            } else {
                themeToggle.textContent = 'Light';
            }
        });

        // Sample JavaScript functions for liking and passing profiles
        function likeProfile() {
            // Logic for liking a profile
        }

        function passProfile() {
            // Logic for passing a profile
        }
    </script>
</body>
</html>
